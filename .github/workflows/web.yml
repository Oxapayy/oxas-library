name: Browser client checks
on:
  push:
    paths: ['web/**', 'website/**', 'desktop/src/renderer.ts', 'desktop/src/model.ts', 'desktop/src/library-view.ts', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'website/**', 'desktop/src/renderer.ts', 'desktop/src/model.ts', 'desktop/src/library-view.ts', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.site.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-site-test-diagnostics
          path: web/test-results-site/
          retention-days: 7
