<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Oxa’s Library · Web</title>
    <meta
      name="description"
      content="Your films, series and live TV in Oxa’s Library, directly in your browser."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/web/icon.png" />
    <link rel="stylesheet" href="/web/app.css" />
    <link rel="stylesheet" href="/web/web.css" />
  </head>
  <body class="web-app">
    <noscript
      ><p class="notice">Enable JavaScript to open your library.</p></noscript
    >
    <header class="web-brandbar">
      <button
        class="web-brand-home"
        data-page="Library"
        aria-label="Oxa’s Library home"
      >
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle
            cx="16"
            cy="16"
            r="13"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          />
          <path d="M13 10 23 16 13 22Z" fill="currentColor" />
        </svg>
        <span>Oxa’s Library</span>
      </button>
      <button
        class="web-account-button"
        data-action="account.open"
        aria-label="Account"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5" />
          <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
        </svg>
      </button>
    </header>
    <aside id="sidebar" aria-label="Navigation"></aside>
    <main id="content" tabindex="-1">
      <div class="empty">
        <h1>Library</h1>
        <p class="busy" role="status">Connecting your library…</p>
      </div>
    </main>
    <div id="toast" role="status" hidden></div>
    <aside id="ad-notice" class="web-notice" aria-labelledby="ad-notice-title" hidden>
      <h2 id="ad-notice-title">Watch without ads</h2>
      <p>Some servers open on their own website, which can show ads. Use the Brave browser to block them, or try the Oxa’s Library app, where servers play without ads.</p>
      <div class="web-notice-actions">
        <a class="web-notice-primary" href="https://brave.com/download/" target="_blank" rel="noopener noreferrer">Get Brave</a>
        <a class="web-notice-secondary" href="/download">Get the App</a>
        <button type="button" class="web-notice-close" data-ad-notice-close>Not Now</button>
      </div>
    </aside>
    <dialog id="sheet" aria-label="Library details"></dialog>
    <dialog id="account" aria-label="Account"></dialog>
    <section id="player" aria-label="Video player" hidden>
      <video id="video" crossorigin="anonymous" playsinline></video>
      <div class="player-top glass">
        <button id="close-player" aria-label="Close player">×</button>
        <div>
          <strong id="player-title"></strong
          ><small id="player-subtitle"></small>
        </div>
        <span class="spacer"></span
        ><button id="fullscreen" aria-label="Toggle full screen">⛶</button>
      </div>
      <div id="playback-error" role="alert" hidden></div>
      <div id="up-next" class="glass" hidden></div>
      <div class="player-bottom glass">
        <div class="timeline">
          <span id="elapsed">0:00</span
          ><input
            id="seek"
            aria-label="Seek"
            type="range"
            min="0"
            max="1000"
            value="0"
          /><span id="duration">0:00</span>
        </div>
        <div class="player-buttons">
          <button id="rewind" aria-label="Rewind 10 seconds">−10</button
          ><button id="toggle-play">Play</button
          ><button id="forward" aria-label="Forward 10 seconds">+10</button
          ><button id="next">Next episode</button><span class="spacer"></span
          ><label class="compact"
            >Volume<input
              id="volume"
              aria-label="Volume"
              type="range"
              min="0"
              max="1"
              step="0.05"
              value="1" /></label
          ><select id="speed" aria-label="Playback speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option></select
          ><select id="tracks" aria-label="Audio track"></select
          ><select id="subtitles" aria-label="Subtitles"></select
          ><button id="import-caption">Add Subtitles</button
          ><button id="fit">Fill</button
          ><button id="pip" aria-label="Picture in Picture">PiP</button>
        </div>
      </div>
    </section>
    <script type="module" src="/web/main.js"></script>
  </body>
</html>
