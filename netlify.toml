[build]
  command = "python3 scripts/prepare-website.py && python3 scripts/prepare-web-site.py"
  publish = "website"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The browser application has its own exact account/media policy. Both policies
# are generated into the publish directory without exposing private build config.
[functions]
  directory = "web-private/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/web"
  to = "/web/index.html"
  status = 200
  force = true
[[redirects]]
  from = "/app"
  to = "/web"
  status = 301
[[redirects]]
  from = "/app/*"
  to = "/web/:splat"
  status = 301

# Revalidate documents and unversioned development entry points.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

